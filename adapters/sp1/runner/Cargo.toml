[package]
name = "profile-sp1-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
guest-workload = { path = "../../../crates/guest-workload" }
hex = "0.4"
profile-schema = { path = "../../../crates/profile-schema" }
serde_json = "1.0"
sha2 = "0.10"
sp1-sdk = { version = "=6.4.0", features = ["profiling"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
sp1-build = "=6.4.0"

