name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  adapter-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - run: cargo +1.91.1 metadata --locked --no-deps --manifest-path adapters/openvm/Cargo.toml
      - run: cargo +1.91.1 metadata --locked --no-deps --manifest-path adapters/sp1/Cargo.toml
      - run: cargo +1.91.1 metadata --locked --no-deps --manifest-path adapters/zisk/Cargo.toml

