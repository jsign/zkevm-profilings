[workspace]
members = [
    "crates/guest-workload",
    "crates/profile-schema",
    "crates/xtask",
]
exclude = ["adapters/openvm", "adapters/sp1", "adapters/zisk"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
hex = "0.4"
inferno = "0.12"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"

[profile.release]
debug = 1
